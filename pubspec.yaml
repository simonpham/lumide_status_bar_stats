name: lumide_status_bar_stats
description: >-
  Lumide IDE plugin that shows CPU, memory, disk, network, battery and CPU
  temperature in the status bar, with a live dashboard. Linux, macOS, Windows.
version: 1.0.0
homepage: https://github.com/simonpham/lumide_status_bar_stats
repository: https://github.com/simonpham/lumide_status_bar_stats
issue_tracker: https://github.com/simonpham/lumide_status_bar_stats/issues

topics:
  - lumide-utils
  - lumide-plugin
  - system-monitor

screenshots:
  - description: CPU, memory, disk, network and CPU temperature in the Lumide status bar.
    path: doc/status_bar.png
  - description: The quick menu with every option and the items to show.
    path: doc/quick_menu.png
  - description: CPU tooltip with load averages.
    path: doc/cpu_tooltip.png
  - description: CPU and memory items with compact mode off.
    path: doc/labeled.png

executables:
  lumide_status_bar_stats: main

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.8.0

dependencies:
  ffi: ^2.1.0
  lumide_api: ^1.7.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
